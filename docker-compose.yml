services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  dungeoncrawler:
    build: .
    container_name: dungeoncrawler5000
    ports:
      - "5001:5001"
    volumes:
      - ./pdfs:/app/pdfs
      - ./data:/app/data
    environment:
      - LLM_API_URL=http://ollama:11434/v1/chat/completions
      - LLM_MODEL=llama3.1:8b
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
