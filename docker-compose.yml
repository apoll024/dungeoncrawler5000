services:
  dungeoncrawler:
    build: .
    container_name: dungeoncrawler5000
    ports:
      - "5001:5001"
    volumes:
      - ./pdfs:/app/pdfs
      - ./data:/app/data
    environment:
      - LLM_API_URL=https://models.inference.ai.azure.com/chat/completions
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: unless-stopped
